<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('portfolio-theme');
          var theme = saved === 'light' || saved === 'dark'
            ? saved
            : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (error) {}
      })();
    </script>
    <meta
      name="description"
      content="Portfolio de Gérémy Citté — développeur web, mobile et créateur d’expériences numériques sur mesure."
    />
    <meta property="og:title" content="Gérémy Citté — Développeur web & créateur d’expériences numériques" />
    <meta property="og:description" content="Découvrez une sélection de projets web, mobiles et communautaires." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Gérémy Citté — Développeur web & mobile</title>
  </head>
  <body>
    <noscript>JavaScript doit être activé pour afficher ce site.</noscript>
    <div id="root"></div>
  </body>
</html>
